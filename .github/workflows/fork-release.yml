name: Fork release

# Publishes a GitHub release of the fork on every push to master.
# The installed fork client reads LatestVersion.json from the latest release
# (see ClientUpdater.ForkLatestVersionUrl) and installs the attached setup silently.
# The version is 1.0.<commit count>.0: it only grows on master and stays above
# the official 0.x releases, so the upstream updater never replaces the fork.

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Set fork version
        run: |
          $version = "1.0.$(git rev-list --count HEAD).0"
          (Get-Content AlbionDataAvalonia.Desktop/pkg/inno.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" |
            Set-Content AlbionDataAvalonia.Desktop/pkg/inno.iss -Encoding utf8
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RELEASE_TAG=v.$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Publish Windows client
        run: dotnet publish ./AlbionDataAvalonia.Desktop/AlbionDataAvalonia.Desktop.csproj --configuration Release -p:Version=${{ env.VERSION }}

      - name: Compile installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: AlbionDataAvalonia.Desktop/pkg/inno.iss
          options: /O+

      - name: Create LatestVersion.json
        run: |
          $version = "${{ env.VERSION }}"
          $tag = "${{ env.RELEASE_TAG }}"
          $repoUrl = "https://github.com/${{ github.repository }}"
          $entry = [ordered]@{
            version = $version
            windowsDownloadUrl = "$repoUrl/releases/download/$tag/AFMDataClientSetup_v_$version.exe"
            releasePageUrl = "$repoUrl/releases/tag/$tag"
          }
          [ordered]@{ version = $version; stable = $entry } | ConvertTo-Json -Depth 4 |
            Out-File -FilePath LatestVersion.json -Encoding utf8
        shell: pwsh

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = "C:/Users/runneradmin/Documents/Inno Setup Output/AFMDataClientSetup_v_${{ env.VERSION }}.exe"
          gh release create "${{ env.RELEASE_TAG }}" $installer LatestVersion.json `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "AFM Data Client (fork) v.${{ env.VERSION }}" `
            --generate-notes `
            --latest
        shell: pwsh
