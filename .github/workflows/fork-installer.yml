name: Fork installer

# Builds a Windows installer from any branch for testing the fork in game.
# It installs over the official client (same AppId) and keeps its settings and history.
# The version is 1.0.<commit count>.<run>: above the master release it branched from,
# so the fork updater doesn't replace it right away, and below the release made
# once the branch is merged into master.

on:
  workflow_dispatch:
  push:
    branches-ignore: [master, beta]

permissions:
  contents: read

# New commits supersede only testing installers of the same branch, never a release.
concurrency:
  group: fork-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-dotnet10-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-dotnet10-

      - name: Set fork version
        run: |
          $version = "1.0.$(git rev-list --count HEAD).${{ github.run_number }}"
          (Get-Content AlbionDataAvalonia.Desktop/pkg/inno.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" |
            Set-Content AlbionDataAvalonia.Desktop/pkg/inno.iss -Encoding utf8
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Publish Windows client
        run: dotnet publish ./AlbionDataAvalonia.Desktop/AlbionDataAvalonia.Desktop.csproj --configuration Release -p:Version=${{ env.VERSION }}

      - name: Compile installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: AlbionDataAvalonia.Desktop/pkg/inno.iss
          # The action passes each nonempty line as a separate compiler argument.
          options: |
            /O+
            /DMyAppCompression=lzma/fast

      - uses: actions/upload-artifact@v4
        with:
          name: AFMDataClientSetup_v_${{ env.VERSION }}
          path: C:/Users/runneradmin/Documents/Inno Setup Output/AFMDataClientSetup_v_${{ env.VERSION }}.exe
          if-no-files-found: error
          compression-level: 0
